<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人博客</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .post {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            margin: 10px 0;
            border-radius: 4px;
        }
        .footer {
            text-align: center;
            color: #666;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>欢迎来到我的博客</h1>
    
    <div class="post">
        <h2>我的第一篇博客</h2>
        <p>大家好！这是我的第一个GitHub Pages博客。</p>
        
        <h3>绝对路径引用的图片：</h3>
        <!-- 绝对路径：使用网络图片URL -->
        <img src="https://www.github.com/favicon.ico" alt="GitHub图标">
        <p>上图使用<strong>绝对路径</strong>引用：https://www.github.com/favicon.ico</p>
        
        <h3>相对路径引用的图片：</h3>
        <!-- 相对路径：使用本地images文件夹中的图片 -->
        <img src="images/photo1.jpg" alt="我的照片1">
        <p>上图使用<strong>相对路径</strong>引用：images/photo1.jpg</p>

        <img src="images/photo2.jpg" alt="我的照片2">
        <p>上图使用<strong>相对路径</strong>引用：images/photo2.jpg</p>
        
        <h3>关于我</h3>
        <p>我是一名计算机专业的学生，热爱编程和技术分享。</p>
    </div>
    
    <div class="footer">
        <p>&copy; 2026 我的个人博客 | 由GitHub Pages提供托管</p>
    </div>
</body>
</html>
